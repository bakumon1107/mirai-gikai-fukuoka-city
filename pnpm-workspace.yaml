packages:
  - "packages/*"
  - "admin"
  - "web"
overrides:
  # 脆弱性対応（間接依存）。修正版以上に寄せる。
  # 親のライブラリが修正版を取り込んだら外してよい。
  # 手順: docs/20261122_1000_依存関係の脆弱性対応手順.md
  '@grpc/grpc-js@<1.14.5': ^1.14.5
  'picomatch@>=2 <2.3.2': ^2.3.2
  'postcss-selector-parser@>=6 <6.1.5': ^6.1.5
  'prismjs@<1.30.0': ^1.30.0
  'protobufjs@>=7 <7.6.6': ^7.6.6
  'rollup@>=4 <4.59.0': ^4.59.0
  'vite@>=7 <7.3.7': ^7.3.7
  'ws@>=8 <8.21.0': ^8.21.0
  'yaml@>=2 <2.8.3': ^2.8.3
  # streamdown（~1.3.0 固定）経由の katex
  'katex@<0.18.2': ^0.19.1
  # Next.js 15.5 が postcss を 8.4.31 に固定しているため寄せる（Next.js が上げたら外す）
  'postcss@<8.5.18': ^8.5.33
  # Next.js 15.5.29 は sharp ^0.34.3 || ^0.35.5 を受け付ける
  'sharp@<0.35.5': ^0.35.5
