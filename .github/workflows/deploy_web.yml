name: Migrate DB then Deploy Web

# このベーステンプレート（base-local/develop）は稼働サービスを持たないため、
# push による自動デプロイは無効にしてある。
#
# fork 先で実際にデプロイする場合は、下の `push: branches:` のコメントアウトを解除し、
# 自分のベースブランチ名に変更すること。
# あわせて SUPABASE_* / WEB_VERCEL_DEPLOY_HOOK_URL のシークレット設定が必要。
#
# NOTE: checkout に `ref:` は指定していないため、`workflow_dispatch` では
# 実行時に選択したブランチ（既定はリポジトリのデフォルトブランチ）がデプロイされる。
# 特定のブランチに固定したい場合は checkout step に `ref:` を追加すること。
on:
  # push:
  #   branches: [your-base/develop]
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      # Supabase CLI セットアップ
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
            version: latest

      # Supabase プロジェクトへリンク（ノンインタラクティブ）
      - name: Supabase link
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # マイグレーション適用（idempotent）
      - name: Supabase db push
        run: |
          supabase db push --include-all
          supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 成功したら Vercel デプロイを開始
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}"
